[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mc-blueprint-blockdata"
version = "0.1.0"
description = "Minecraft Java Edition block data generator for mc-blueprint"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["colour-science>=0.4.6,<0.5", "jsonschema>=4.23,<5", "numpy>=2,<3", "pillow>=10,<13"]

[project.scripts]
mcblockdata = "mcblockdata.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.14,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/mcblockdata"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
